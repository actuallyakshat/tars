[package]
name = "tars-desktop"
version = "0.1.0"
description = "Tars for macOS"
edition = "2021"
license = "MIT"
default-run = "Tars"

# macOS names the running app after its binary (menu bar, Dock, ⌘Tab), so
# the binary carries the product name rather than the crate's.
[[bin]]
name = "Tars"
path = "src/main.rs"

[lib]
name = "tars_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
