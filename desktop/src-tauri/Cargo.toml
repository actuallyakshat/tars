[package]
name = "tars-desktop"
version = "0.1.0"
description = "tars for macOS"
edition = "2021"
license = "MIT"

[lib]
name = "tars_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
